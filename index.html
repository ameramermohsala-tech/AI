<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#17202B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="المجلس">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>المجلس — فريق من النماذج</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light dark;
  --bg:#F2F4F6; --surface:#FFFFFF; --ink:#17202B; --muted:#5C6877; --line:#D9DFE6;
  --btn:#17202B; --btn-ink:#FFFFFF; --user:#E3E9F0; --danger:#B3261E;
  --c0:#0B7A75; --c1:#5B3FD1; --c2:#8F6200; --c3:#C23A50; --c4:#1F6FD1; --c5:#2E7D32;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10151B; --surface:#18202A; --ink:#E8EDF2; --muted:#9AA7B5; --line:#2A3541;
    --btn:#E8EDF2; --btn-ink:#10151B; --user:#233040; --danger:#FF8A80;
    --c0:#4FD1C5; --c1:#A394FF; --c2:#F0B429; --c3:#FF7A90; --c4:#6FB1FF; --c5:#6FD28A;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:'IBM Plex Sans Arabic','Noto Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  font-size:16px; line-height:1.7; overscroll-behavior:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--c4);outline-offset:2px}
[hidden]{display:none!important}

#app{display:flex;flex-direction:column;height:100dvh;max-width:760px;margin:0 auto}

header{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 8px}
header h1{font-size:19px;font-weight:600;margin:0;flex:1}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 11px;font-size:14px}
.icon-btn:hover{border-color:var(--muted)}

#roster{display:flex;gap:8px;flex-wrap:wrap;padding:2px 14px 10px;border-bottom:1px solid var(--line)}
.chip{display:flex;align-items:center;gap:7px;padding:3px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:14px}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--pc);display:block}
.chip.speaking{border-color:var(--pc)}
.chip.speaking i{animation:pulse 1.1s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--pc)}100%{box-shadow:0 0 0 9px transparent}}

/* ---- المحادثة ---- */
#chatView{display:flex;flex-direction:column;flex:1;min-height:0}
#log{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:18px}
.msg{max-width:100%}
.msg .who{font-size:13px;font-weight:600;margin-bottom:2px}
.msg.ai{border-inline-start:3px solid var(--pc);padding-inline-start:12px}
.msg.ai .who{color:var(--pc)}
.msg .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-start;background:var(--user);padding:8px 14px;border-radius:14px;max-width:88%}
.msg.me .who{color:var(--muted)}
.msg.err .txt{color:var(--danger);font-size:14px}
.typing .txt::after{content:'…';color:var(--muted);animation:blink 1s steps(3,end) infinite}
@keyframes blink{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}

#empty{margin:auto 0;padding:6px 2px}
#empty h2{font-size:22px;margin:0 0 6px;font-weight:600}
#empty p{margin:0 0 14px;color:var(--muted)}
.topics{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.topics button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px;text-align:right;font-size:15px}
#keyhint{margin-top:14px;font-size:14px;color:var(--muted)}
#keyhint button{border:0;background:none;padding:0;color:var(--c4);text-decoration:underline}

#composer{padding:10px 14px;border-top:1px solid var(--line);background:var(--bg)}
.row{display:flex;gap:8px;align-items:flex-end}
textarea#input{flex:1;resize:none;max-height:140px;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.btn{border:0;background:var(--btn);color:var(--btn-ink);border-radius:12px;padding:0 18px;height:44px;font-weight:600}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tools{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;font-size:14px}
.tools select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 8px}
.sp{flex:1}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 12px;font-size:14px}
.ghost:disabled{opacity:.4;cursor:not-allowed}
.ghost.stop{border-color:var(--danger);color:var(--danger)}

/* ---- المهام ---- */
#tasksView{flex:1;min-height:0;overflow-y:auto}
.tscroll{padding:14px;display:flex;flex-direction:column;gap:12px}
.field{display:grid;gap:4px;font-size:14px}
.field textarea,.field select,.field input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:15px}
.note{font-size:13px;color:var(--muted);margin:0}
.note.bad{color:var(--danger)}
.sep{border-top:1px solid var(--line)}
.tbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.task{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--pc);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.thead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.thead b{font-weight:600}
.badge{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:0 9px;white-space:nowrap;color:var(--muted)}
.task.running .badge{border-color:var(--c4);color:var(--c4);animation:blink 1.2s infinite}
.task.done .badge{border-color:var(--c5);color:var(--c5)}
.task.error .badge{border-color:var(--danger);color:var(--danger)}
.ins{font-size:14px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.res{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;border-top:1px dashed var(--line);padding-top:6px;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.res.open{display:block}
.res.bad{color:var(--danger)}
.tbtns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tbtns select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:3px 6px;font-size:14px}
.summary{border:2px solid var(--ink);border-radius:12px;padding:12px;background:var(--surface);display:grid;gap:6px}
.summary h3{margin:0;font-size:16px}
.summary .txt{white-space:pre-wrap;overflow-wrap:anywhere}

/* ---- التبويبات السفلية ---- */
#tabs{display:flex;border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;border:0;background:none;padding:11px 0;font-weight:500;color:var(--muted);border-top:3px solid transparent;margin-top:-1px}
#tabs button[aria-selected=true]{color:var(--ink);border-top-color:var(--ink)}

/* ---- الإعدادات ---- */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink);padding:0;width:min(640px,calc(100vw - 20px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-h{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:1}
.dlg-h h2{margin:0;font-size:18px;flex:1;font-weight:600}
.dlg-b{padding:14px 16px 18px;display:flex;flex-direction:column;gap:14px}
.card{border:1px solid var(--line);border-inline-start:4px solid var(--pc);border-radius:12px;background:var(--surface);padding:12px;display:grid;gap:8px}
.card label{display:grid;gap:2px;font-size:13px;color:var(--muted)}
.card input,.card select,.card textarea{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-size:15px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:460px){.g2{grid-template-columns:1fr}}
.card .top{display:flex;justify-content:space-between;align-items:center}
.card .top b{color:var(--pc)}
.del{border:0;background:none;color:var(--danger);font-size:14px}
.add{display:flex;gap:8px}
.add select{flex:1;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>المجلس</h1>
    <button class="icon-btn" id="btnSave">حفظ</button>
    <button class="icon-btn" id="btnClear">جديد</button>
    <button class="icon-btn" id="btnSettings">الإعدادات</button>
  </header>

  <div id="roster" aria-label="المشاركون"></div>

  <section id="chatView">
    <main id="log" aria-live="polite"></main>
    <div id="composer">
      <div class="row">
        <textarea id="input" rows="1" placeholder="اكتب رسالتك للمجلس…"></textarea>
        <button class="btn" id="btnSend">أرسل</button>
      </div>
      <div class="tools">
        <label>الجولات
          <select id="rounds"><option>1</option><option>2</option><option>3</option><option>4</option></select>
        </label>
        <button class="ghost" id="btnAuto">دعهم يكملون</button>
        <span class="sp"></span>
        <button class="ghost stop" id="btnStop" hidden>إيقاف</button>
      </div>
    </div>
  </section>

  <section id="tasksView" hidden>
    <div class="tscroll">
      <div class="field">
        <label for="goalIn">الهدف</label>
        <textarea id="goalIn" rows="3" placeholder="مثال: جهّز خطة إطلاق متجر إلكتروني لبيع القهوة، مع نص الإعلان وهيكل الموقع"></textarea>
      </div>
      <div class="row">
        <div class="field" style="flex:1">
          <label for="leadSel">المنسّق (يقسّم العمل ويكتب الخلاصة)</label>
          <select id="leadSel"></select>
        </div>
        <button class="btn" id="btnPlan">خطّط ونفّذ</button>
      </div>
      <p class="note" id="taskMsg"></p>

      <div class="sep"></div>

      <div class="field">
        <label for="taskIn">أو أضف مهمة بنفسك</label>
        <textarea id="taskIn" rows="2" placeholder="مثال: اكتب ثلاثة شعارات قصيرة للمتجر"></textarea>
      </div>
      <div class="row">
        <div class="field" style="flex:1"><select id="assignSel" aria-label="المنفّذ"></select></div>
        <button class="ghost" id="btnAddTask" style="height:40px">أضف المهمة</button>
      </div>

      <div class="tbar">
        <button class="ghost" id="btnRunAll">نفّذ المتبقي</button>
        <button class="ghost stop" id="btnStop2" hidden>إيقاف</button>
        <span class="sp"></span>
        <button class="ghost" id="btnClearTasks">مسح المهام</button>
      </div>

      <div id="taskList" style="display:grid;gap:10px"></div>
    </div>
  </section>

  <nav id="tabs" role="tablist">
    <button role="tab" id="tabChat" aria-selected="true">المحادثة</button>
    <button role="tab" id="tabTasks" aria-selected="false">المهام</button>
  </nav>
</div>

<dialog id="settings">
  <div class="dlg-h">
    <h2>الفريق والإعدادات</h2>
    <button class="icon-btn" id="btnCloseSettings">تم</button>
  </div>
  <div class="dlg-b" id="settingsBody"></div>
</dialog>

<script>
(() => {
  'use strict';

  /* ---------- تخزين ---------- */
  const mem = {};
  const store = {
    get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] ?? null; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k] = v; } }
  };

  const PALETTE = 6;
  const PRESETS = {
    gpt:        { name:'ChatGPT', provider:'openai', model:'gpt-4o', baseUrl:'https://api.openai.com/v1' },
    claude:     { name:'Claude', provider:'anthropic', model:'claude-sonnet-5-5', baseUrl:'https://api.anthropic.com' },
    gemini:     { name:'Gemini', provider:'openai', model:'gemini-2.0-flash', baseUrl:'https://generativelanguage.googleapis.com/v1beta/openai' },
    deepseek:   { name:'DeepSeek', provider:'openai', model:'deepseek-chat', baseUrl:'https://api.deepseek.com/v1' },
    mistral:    { name:'Mistral', provider:'openai', model:'mistral-large-latest', baseUrl:'https://api.mistral.ai/v1' },
    openrouter: { name:'OpenRouter', provider:'openai', model:'', baseUrl:'https://openrouter.ai/api/v1' },
    ollama:     { name:'Ollama', provider:'openai', model:'llama3.2', baseUrl:'http://localhost:11434/v1' },
    custom:     { name:'نموذج جديد', provider:'openai', model:'', baseUrl:'' }
  };
  const PRESET_LABELS = {
    gpt:'ChatGPT (OpenAI)', claude:'Claude (Anthropic)', gemini:'Gemini (Google)', deepseek:'DeepSeek',
    mistral:'Mistral', openrouter:'OpenRouter (مفتاح واحد لعدة نماذج)', ollama:'Ollama (محلي)', custom:'أي خدمة متوافقة مع OpenAI'
  };

  const uid = () => Math.random().toString(36).slice(2, 8);
  const mk = (preset, ci, system) => ({ id: uid(), ci, apiKey:'', system: system || '', ...PRESETS[preset] });

  const DEFAULTS = () => ({
    rounds: 1,
    rules: 'اجعل ردودك مختصرة في المحادثة، وتحدّث بالعربية ما لم يُطلب غير ذلك.',
    leadId: null, goal: '', summary: '', tasks: [],
    participants: [
      mk('claude', 0, 'أنت المحلّل المتأني الذي يفكّر في التفاصيل.'),
      mk('gpt',    1, 'أنت الناقد الذي يختبر الأفكار ويبحث عن نقاط الضعف.'),
      mk('gemini', 2, 'أنت المبدع الذي يقترح حلولاً غير تقليدية.')
    ]
  });

  let state;
  try { state = JSON.parse(store.get('majlis') || 'null'); } catch(e){ state = null; }
  if (!state || !Array.isArray(state.participants) || !state.participants.length) state = DEFAULTS();
  state.tasks = Array.isArray(state.tasks) ? state.tasks : [];
  state.goal = state.goal || ''; state.summary = state.summary || ''; state.rounds = state.rounds || 1;
  state.tasks.forEach(t => { if (t.status === 'running') t.status = 'pending'; });
  const persist = () => store.set('majlis', JSON.stringify(state));

  let history = [];
  let busy = false;
  let abort = null;

  /* ---------- DOM ---------- */
  const $ = id => document.getElementById(id);
  function el(tag, props = {}, ...kids){
    const n = document.createElement(tag);
    for (const [k,v] of Object.entries(props)){
      if (k === 'class') n.className = v;
      else if (k === 'style') n.style.cssText = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else if (v === true) n.setAttribute(k, '');
      else if (v !== false && v != null) n.setAttribute(k, v);
    }
    kids.flat().forEach(c => { if (c == null || c === false) return; n.append(c instanceof Node ? c : document.createTextNode(c)); });
    return n;
  }
  const colorOf = p => `var(--c${p.ci % PALETTE})`;
  const byId = id => state.participants.find(p => p.id === id);
  const getLead = () => byId(state.leadId) || state.participants[0];
  const log = $('log');

  /* ---------- الواجهة العامة ---------- */
  function renderRoster(speakingId){
    $('roster').replaceChildren(...state.participants.map(p =>
      el('div', { class:'chip' + (p.id === speakingId ? ' speaking' : ''), style:`--pc:${colorOf(p)}` }, el('i'), p.name)));
  }

  function hasAnyKey(){ return state.participants.some(p => p.apiKey || /localhost|127\.0\.0\.1/.test(p.baseUrl)); }

  function refreshSelects(){
    const opts = () => state.participants.map(p => el('option', { value:p.id }, p.name));
    const lead = $('leadSel'); lead.replaceChildren(...opts()); lead.value = getLead().id;
    const as = $('assignSel'); const cur = as.value; as.replaceChildren(...opts()); if (byId(cur)) as.value = cur;
  }

  function showView(v){
    const chat = v === 'chat';
    $('chatView').hidden = !chat; $('tasksView').hidden = chat;
    $('tabChat').setAttribute('aria-selected', chat); $('tabTasks').setAttribute('aria-selected', !chat);
    if (!chat) renderTasks();
  }

  function updateUI(){
    $('btnSend').disabled = busy;
    $('btnAuto').disabled = busy || !history.length;
    $('btnStop').hidden = !busy; $('btnStop2').hidden = !busy;
    $('btnPlan').disabled = busy; $('btnRunAll').disabled = busy; $('btnAddTask').disabled = busy;
    $('rounds').value = String(state.rounds);
  }

  async function withBusy(fn){
    if (busy) return;
    busy = true; abort = new AbortController(); updateUI();
    try { await fn(); }
    catch(e){ if (e.name !== 'AbortError') setMsg(e.message, true); }
    finally { busy = false; renderRoster(); updateUI(); renderTasks(); }
  }

  /* ---------- الاتصال بالنماذج ---------- */
  async function httpJson(url, headers, body, signal){
    let r;
    try {
      r = await fetch(url, { method:'POST', signal, headers:{ 'content-type':'application/json', ...headers }, body: JSON.stringify(body) });
    } catch(e){
      if (e.name === 'AbortError') throw e;
      throw new Error('تعذّر الاتصال بالخدمة. تحقق من العنوان والمفتاح، وأن الخدمة تسمح بالاتصال من المتصفح (CORS). إن استمرت المشكلة جرّب OpenRouter.');
    }
    if (!r.ok) throw new Error(`خطأ ${r.status}: ${(await r.text()).slice(0, 220)}`);
    return r.json();
  }

  async function callModel(p, system, prompt, signal, maxTokens = 800){
    const local = /localhost|127\.0\.0\.1/.test(p.baseUrl);
    if (!p.apiKey && !(p.provider !== 'anthropic' && local)) throw new Error(`أضف مفتاح API للنموذج ${p.name} من الإعدادات.`);
    if (!p.model) throw new Error(`حدّد اسم النموذج لـ ${p.name} من الإعدادات.`);
    const base = (p.baseUrl || '').replace(/\/$/, '');

    if (p.provider === 'anthropic'){
      const d = await httpJson(base + '/v1/messages', {
        'x-api-key': p.apiKey, 'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      }, { model:p.model, max_tokens:maxTokens, system, messages:[{ role:'user', content:prompt }] }, signal);
      return d.content.map(b => b.text || '').join('').trim();
    }
    const d = await httpJson(base + '/chat/completions',
      p.apiKey ? { authorization:'Bearer ' + p.apiKey } : {},
      { model:p.model, max_tokens:maxTokens,
        messages:[{ role:'system', content:system }, { role:'user', content:prompt }] }, signal);
    return d.choices[0].message.content.trim();
  }

  /* ---------- المحادثة ---------- */
  function renderEmpty(){
    const topics = [
      'ما أفضل طريقة لتعلّم لغة جديدة خلال ٦ أشهر؟',
      'هل ينبغي لشركة ناشئة أن تبدأ بتطبيق جوال أم موقع ويب؟',
      'ناقشوا: هل العمل عن بُعد أفضل للإنتاجية؟'
    ];
    log.replaceChildren(el('div', { id:'empty' },
      el('h2', {}, 'اطرح موضوعاً على المجلس'),
      el('p', {}, 'سيرد كل نموذج بدوره وهو يقرأ ما قاله الآخرون. وللأعمال المحددة استخدم تبويب «المهام».'),
      el('div', { class:'topics' }, topics.map(t => el('button', { onclick: () => send(t) }, t))),
      el('div', { id:'keyhint', hidden: hasAnyKey() }, 'لم تضف أي مفتاح API بعد. ', el('button', { onclick: openSettings }, 'افتح الإعدادات'))));
  }

  function addBubble(m){
    $('empty')?.remove();
    const p = m.pid ? byId(m.pid) : null;
    const d = el('div', { class:'msg ' + (p ? 'ai' : 'me') + (m.pending ? ' typing' : '') });
    if (p) d.style.setProperty('--pc', colorOf(p));
    const body = el('div', { class:'txt' }, m.text || '');
    d.append(el('div', { class:'who' }, m.who), body);
    log.append(d); log.scrollTop = log.scrollHeight;
    return { d, body };
  }

  const transcript = () => history.filter(m => !m.error).map(m => `[${m.who}]: ${m.text}`).join('\n\n');

  function chatSystem(p){
    const names = state.participants.map(x => x.name).join('، ');
    return `أنت '${p.name}' في غرفة محادثة تضم: ${names} والمستخدم. ${p.system || ''} ${state.rules || ''} ` +
           'تحدّث بصيغة المتكلم، ولا تكتب اسمك في بداية الرد، وأضف شيئاً جديداً بدل تكرار ما قيل.';
  }

  async function chatTurn(p){
    renderRoster(p.id);
    const ui = addBubble({ who:p.name, pid:p.id, pending:true });
    try {
      const prompt = `المحادثة حتى الآن:\n\n${transcript()}\n\nالآن دورك يا ${p.name}.`;
      const text = await callModel(p, chatSystem(p), prompt, abort.signal);
      ui.d.classList.remove('typing'); ui.body.textContent = text;
      history.push({ who:p.name, pid:p.id, text });
    } catch(e){
      if (e.name === 'AbortError'){ ui.d.remove(); return; }
      ui.d.classList.remove('typing'); ui.d.classList.add('err'); ui.body.textContent = e.message;
      history.push({ who:p.name, pid:p.id, text:e.message, error:true });
    }
    log.scrollTop = log.scrollHeight;
  }

  const runRounds = n => withBusy(async () => {
    for (let r = 0; r < n; r++)
      for (const p of state.participants){
        if (abort.signal.aborted) return;
        await chatTurn(p);
      }
  });

  function send(text){
    text = (text ?? $('input').value).trim();
    if (!text || busy) return;
    history.push({ who:'أنت', text }); addBubble({ who:'أنت', text });
    $('input').value = ''; autosize();
    runRounds(state.rounds);
  }

  /* ---------- المهام ---------- */
  const STATUS = { pending:'بانتظار التنفيذ', running:'جارٍ العمل', done:'تمّت', error:'فشلت' };
  const nameOf = t => (byId(t.pid) || state.participants[0]).name;

  function setMsg(text, bad){ const m = $('taskMsg'); m.textContent = text || ''; m.classList.toggle('bad', !!bad); }

  async function copy(text){ try { await navigator.clipboard.writeText(text); setMsg('تم النسخ.'); } catch(e){ setMsg('تعذّر النسخ، حدّد النص يدوياً.', true); } }

  function taskCard(t){
    const p = byId(t.pid) || state.participants[0];
    const canEdit = t.status !== 'running';
    return el('div', { class:'task ' + t.status, style:`--pc:${colorOf(p)}` },
      el('div', { class:'thead' }, el('b', {}, t.title), el('span', { class:'badge' }, STATUS[t.status])),
      t.instructions && t.instructions !== t.title ? el('div', { class:'ins' }, t.instructions) : null,
      t.result ? el('div', { class:'res' + (t.open ? ' open' : '') + (t.status === 'error' ? ' bad' : ''),
        onclick: () => { t.open = !t.open; renderTasks(); } }, t.result) : null,
      el('div', { class:'tbtns' },
        el('select', { 'aria-label':'المنفّذ', disabled: !canEdit || busy, onchange: e => { t.pid = e.target.value; persist(); renderTasks(); } },
          state.participants.map(q => el('option', { value:q.id, selected: q.id === p.id }, q.name))),
        el('button', { class:'ghost', disabled: busy, onclick: () => withBusy(() => execTask(t)) }, t.status === 'done' ? 'أعد التنفيذ' : 'نفّذ'),
        t.status === 'done' ? el('button', { class:'ghost', onclick: () => copy(t.result) }, 'نسخ') : null,
        el('button', { class:'ghost', disabled: busy, onclick: () => { state.tasks = state.tasks.filter(x => x !== t); persist(); renderTasks(); } }, 'حذف')));
  }

  function renderTasks(){
    const box = $('taskList');
    const items = state.tasks.map(taskCard);
    if (state.summary){
      items.push(el('div', { class:'summary' },
        el('h3', {}, 'الخلاصة النهائية'),
        el('div', { class:'txt' }, state.summary),
        el('div', { class:'tbtns' }, el('button', { class:'ghost', onclick: () => copy(state.summary) }, 'نسخ'))));
    }
    if (!items.length) items.push(el('p', { class:'note' }, 'لا توجد مهام بعد. اكتب هدفاً ليقسّمه المنسّق ويوزّعه على الفريق، أو أضف مهمة بنفسك.'));
    box.replaceChildren(...items);
  }

  function taskSystem(p){
    return `أنت '${p.name}'، عضو في فريق نماذج ذكاء اصطناعي. ${p.system || ''} ` +
           'نفّذ المهمة المسندة إليك وقدّم النتيجة النهائية مباشرة (نص أو كود أو خطة حسب المهمة) دون مقدمات. ' +
           'تحدّث بالعربية ما لم تتطلب المهمة غير ذلك.';
  }

  async function execTask(t){
    const p = byId(t.pid) || state.participants[0];
    t.status = 'running'; t.result = ''; renderTasks(); renderRoster(p.id);
    try {
      const ctx = state.tasks.filter(x => x !== t && x.status === 'done')
        .map(x => `### ${x.title} (${nameOf(x)})\n${x.result.slice(0, 1500)}`).join('\n\n');
      const prompt =
        (state.goal ? `الهدف العام: ${state.goal}\n\n` : '') +
        (ctx ? `نتائج المهام السابقة من زملائك:\n${ctx}\n\n` : '') +
        `المهمة المطلوبة منك:\n${t.title}\n${t.instructions && t.instructions !== t.title ? t.instructions : ''}`;
      t.result = await callModel(p, taskSystem(p), prompt, abort.signal, 1500);
      t.status = 'done';
    } catch(e){
      if (e.name === 'AbortError'){ t.status = 'pending'; t.result = ''; }
      else { t.status = 'error'; t.result = e.message; }
    }
    persist(); renderTasks();
  }

  async function runPending(){
    for (const t of state.tasks){
      if (abort.signal.aborted) return;
      if (t.status === 'pending' || t.status === 'error') await execTask(t);
    }
  }

  async function maybeSummarize(){
    if (abort.signal.aborted || state.tasks.length < 2 || !state.tasks.every(t => t.status === 'done') || state.summary) return;
    const lead = getLead();
    renderRoster(lead.id); setMsg(`${lead.name} يكتب الخلاصة…`);
    const body = state.tasks.map(t => `### ${t.title} (${nameOf(t)})\n${t.result}`).join('\n\n');
    state.summary = await callModel(lead,
      'أنت منسّق فريق نماذج ذكاء اصطناعي. اجمع نتائج الزملاء في خلاصة نهائية واضحة ومتكاملة تحقق الهدف، بالعربية.',
      `الهدف: ${state.goal || '(غير محدد)'}\n\nنتائج الفريق:\n${body}\n\nاكتب الخلاصة النهائية.`,
      abort.signal, 1500);
    persist(); setMsg('اكتملت الخطة.');
  }

  const planAndRun = () => withBusy(async () => {
    const goal = $('goalIn').value.trim();
    if (!goal){ setMsg('اكتب الهدف أولاً.', true); return; }
    state.goal = goal; state.summary = ''; persist();
    const lead = getLead();
    setMsg(`${lead.name} يضع الخطة…`); renderRoster(lead.id);
    const team = state.participants.map(p => `- ${p.name}${p.system ? ': ' + p.system : ''}`).join('\n');
    const raw = await callModel(lead,
      'أنت منسّق فريق من نماذج الذكاء الاصطناعي. أجب بـ JSON فقط، دون أي نص آخر ودون علامات ```.',
      `الهدف: ${goal}\n\nأعضاء الفريق:\n${team}\n\nقسّم الهدف إلى مهام متسلسلة (من 2 إلى 6) وأسند كل مهمة لأنسب عضو. الصيغة:\n` +
      '[{"title":"عنوان قصير","assignee":"اسم العضو كما هو مكتوب أعلاه","instructions":"تعليمات واضحة ومحددة"}]',
      abort.signal, 1200);
    const m = raw.match(/\[[\s\S]*\]/);
    let arr; try { arr = JSON.parse(m ? m[0] : ''); } catch(e){ arr = null; }
    if (!Array.isArray(arr) || !arr.length) throw new Error('لم يُرجع المنسّق خطة مفهومة. أعد المحاولة أو اختر منسّقاً آخر.');
    state.tasks = arr.slice(0, 6).map((x, i) => {
      const p = state.participants.find(q => q.name.toLowerCase() === String(x.assignee || '').trim().toLowerCase())
             || state.participants[i % state.participants.length];
      return { id:uid(), title:String(x.title || 'مهمة').slice(0, 80), instructions:String(x.instructions || ''), pid:p.id, status:'pending', result:'' };
    });
    persist(); renderTasks(); setMsg('بدأ التنفيذ…');
    await runPending();
    await maybeSummarize();
    if (!abort.signal.aborted && !state.summary) setMsg('انتهى التنفيذ.');
  });

  const runAll = () => withBusy(async () => {
    if (!state.tasks.some(t => t.status === 'pending' || t.status === 'error')){ setMsg('لا توجد مهام متبقية.'); return; }
    setMsg('جارٍ التنفيذ…');
    await runPending();
    await maybeSummarize();
    if (!abort.signal.aborted) setMsg('انتهى التنفيذ.');
  });

  function addTask(){
    const text = $('taskIn').value.trim();
    if (!text) return;
    state.tasks.push({ id:uid(), title:text.split('\n')[0].slice(0, 70), instructions:text, pid:$('assignSel').value, status:'pending', result:'' });
    state.summary = '';
    $('taskIn').value = ''; persist(); renderTasks();
  }

  /* ---------- الإعدادات ---------- */
  function openSettings(){ renderSettings(); $('settings').showModal(); }

  function renderSettings(){
    const bind = (obj, key) => e => { obj[key] = e.target.value; persist(); };
    const cards = state.participants.map(p => {
      const f = (label, input) => el('label', {}, label, input);
      return el('div', { class:'card', style:`--pc:${colorOf(p)}` },
        el('div', { class:'top' }, el('b', {}, p.name || 'بدون اسم'),
          el('button', { class:'del', onclick: () => {
            if (state.participants.length <= 1) return;
            state.participants = state.participants.filter(x => x.id !== p.id);
            persist(); renderSettings();
          } }, 'حذف')),
        el('div', { class:'g2' },
          f('الاسم', el('input', { value:p.name, oninput:bind(p, 'name') })),
          f('النوع', el('select', { onchange: e => { p.provider = e.target.value; persist(); } },
            el('option', { value:'anthropic', selected:p.provider === 'anthropic' }, 'Anthropic'),
            el('option', { value:'openai', selected:p.provider === 'openai' }, 'متوافق مع OpenAI')))),
        el('div', { class:'g2' },
          f('اسم النموذج', el('input', { value:p.model, dir:'ltr', oninput:bind(p, 'model') })),
          f('مفتاح API', el('input', { type:'password', value:p.apiKey, dir:'ltr', autocomplete:'off', oninput:bind(p, 'apiKey') }))),
        f('عنوان الخدمة', el('input', { value:p.baseUrl, dir:'ltr', oninput:bind(p, 'baseUrl') })),
        f('دوره في الفريق', el('textarea', { rows:'2', oninput:bind(p, 'system') }, p.system || '')));
    });

    const sel = el('select', {}, Object.entries(PRESET_LABELS).map(([k, v]) => el('option', { value:k }, v)));
    const add = el('div', { class:'add' }, sel, el('button', { class:'ghost', onclick: () => {
      const used = new Set(state.participants.map(x => x.ci % PALETTE));
      let ci = 0; while (used.has(ci) && ci < PALETTE) ci++;
      state.participants.push(mk(sel.value, ci));
      persist(); renderSettings();
    } }, 'إضافة'));

    $('settingsBody').replaceChildren(
      el('p', { class:'note' }, 'المفاتيح تُحفظ في هاتفك فقط وتُرسل مباشرة إلى مزوّد كل نموذج دون خادم وسيط. ملاحظة: اشتراك ChatGPT Plus لا يتضمن مفتاح API، فالمفتاح يُنشأ بشكل منفصل من منصة OpenAI.'),
      ...cards, add,
      el('div', { class:'field card', style:'--pc:var(--line)' },
        el('label', {}, 'قواعد المحادثة (تُرسل لكل النماذج)',
          el('textarea', { rows:'2', oninput:bind(state, 'rules') }, state.rules || ''))));
  }

  $('settings').addEventListener('close', () => {
    state.participants.forEach(p => { p.name = (p.name || '').trim() || 'نموذج'; });
    persist(); renderRoster(); refreshSelects(); renderTasks();
    if (!history.length) renderEmpty();
  });

  /* ---------- أحداث ---------- */
  function autosize(){ const t = $('input'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 140) + 'px'; }
  $('input').addEventListener('input', autosize);
  $('input').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); send(); } });
  $('btnSend').onclick = () => send();
  $('btnAuto').onclick = () => runRounds(1);
  $('btnStop').onclick = $('btnStop2').onclick = () => abort && abort.abort();
  $('btnSettings').onclick = openSettings;
  $('btnCloseSettings').onclick = () => $('settings').close();
  $('rounds').onchange = e => { state.rounds = +e.target.value; persist(); };
  $('tabChat').onclick = () => showView('chat');
  $('tabTasks').onclick = () => showView('tasks');
  $('leadSel').onchange = e => { state.leadId = e.target.value; persist(); };
  $('btnPlan').onclick = planAndRun;
  $('btnRunAll').onclick = runAll;
  $('btnAddTask').onclick = addTask;
  $('btnClearTasks').onclick = () => { if (busy) return; state.tasks = []; state.summary = ''; persist(); setMsg(''); renderTasks(); };
  $('btnClear').onclick = () => { if (busy) abort.abort(); history = []; renderEmpty(); updateUI(); };

  $('btnSave').onclick = () => {
    const parts = [];
    if (history.length) parts.push('# المحادثة\n\n' + transcript());
    if (state.tasks.length) parts.push('# المهام\n\n' + state.tasks.map(t => `## ${t.title} — ${nameOf(t)} (${STATUS[t.status]})\n${t.result}`).join('\n\n'));
    if (state.summary) parts.push('# الخلاصة\n\n' + state.summary);
    if (!parts.length) return;
    const blob = new Blob([parts.join('\n\n')], { type:'text/plain;charset=utf-8' });
    const a = el('a', { href:URL.createObjectURL(blob), download:`majlis_${new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-')}.txt` });
    document.body.append(a); a.click(); a.remove();
  };

  /* ---------- بدء التشغيل ---------- */
  $('goalIn').value = state.goal;
  renderRoster(); refreshSelects(); renderEmpty(); renderTasks(); updateUI();

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
